# Default Configuration for Memory Interference Forensics
# Author: Soroush Bagheri
# Date: January 2026

# Model Configuration
model:
  name: "gpt-4-turbo"  # Options: gpt-4-turbo, claude-3-5-sonnet, mock
  temperature: 0.7
  max_tokens: 1024

# Detector Configuration
detector:
  threshold: 0.5  # IDS threshold for flagging interference
  n_samples: 5    # Number of samples for inconsistency detection
  weights:
    attention_divergence: 0.40
    semantic_conflict: 0.35
    response_inconsistency: 0.25

# Mitigation Configuration
mitigation:
  default_strategy: "soft_masking"  # Options: none, soft_masking, hard_masking, reordering
  mask_token: "[MASKED]"
  mask_ratio: 0.5

# Experiment Configuration
experiment:
  seed: 42
  n_runs: 100
  cache_responses: true
  cache_dir: "./data/cache"

# Logging
logging:
  level: "INFO"
  log_file: "./results/logs/experiment.log"
